<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E7C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AMPA Murcia">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>AMPA Murcia</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--tinta:#0E2A47;--mar:#0F6E7C;--mar2:#19B3A6;--limon:#FFC83D;--fondo:#F2F5FA;--suave:#6B7C93;--error:#D6362B;
--t:'Bricolage Grotesque','Trebuchet MS',sans-serif;--c:'Nunito Sans','Segoe UI',sans-serif;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:#DCE4EE;font:16px/1.5 var(--c);color:var(--tinta)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer;font-weight:700}
button:active{transform:scale(.97)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--fondo);position:relative;box-shadow:0 0 40px #0e2a4722}
h1,h2,h3{font-family:var(--t);margin:0;line-height:1.15}
.hero{padding:calc(var(--sa) + 16px) 20px 56px;color:#fff;background:linear-gradient(150deg,var(--mar),var(--mar2));border-radius:0 0 34px 34px}
.admin .hero{background:linear-gradient(150deg,#0E2A47,#2F6296)}
.top{display:flex;justify-content:space-between;align-items:center;font:800 1rem var(--t)}
.ib{width:40px;height:40px;border-radius:14px;background:#ffffff26;color:#fff;display:grid;place-items:center;padding:0}
.hi{font:800 2.1rem/1.08 var(--t);margin:22px 0 12px}
.chip{display:inline-block;background:#ffffff2e;border-radius:99px;padding:3px 12px;font-weight:700;font-size:.85rem;margin:0 6px 6px 0}
.stats{display:flex;gap:10px;margin-top:6px}.stats div{flex:1;background:#ffffff1f;border-radius:16px;padding:10px 12px;font-size:.8rem}.stats b{display:block;font:800 1.5rem var(--t)}
.body{padding:0 16px 120px;margin-top:-36px}
.card{background:#fff;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px #0e2a4714}
.act{display:flex;gap:14px}
.act.old{opacity:.6}
.next{background:linear-gradient(135deg,var(--limon),#FFE493)}
.tag{font:800 .7rem var(--c);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.fecha{flex:0 0 56px;height:max-content;text-align:center;background:var(--tinta);color:#fff;border-radius:16px;padding:7px 0}
.next .fecha{background:#fff;color:var(--tinta)}
.fecha b{display:block;font:800 1.45rem/1 var(--t)}.fecha span{font-size:.75rem;font-weight:700;text-transform:uppercase}
.ai{flex:1;min-width:0}.ai h3{font-size:1.1rem}
.meta{color:var(--suave);font-size:.88rem}.next .meta{color:#4a4020}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#E3F3F1;color:var(--mar);border-radius:99px;padding:7px 13px;font-size:.85rem;font-weight:700;text-decoration:none}
.admin .pill{background:#E4ECF6;color:var(--tinta)}
.pill.on{background:var(--mar);color:#fff}.pill.dan{background:#FCE6E4;color:var(--error)}
.code{font:800 1.05rem monospace;letter-spacing:.1em;background:var(--fondo);padding:5px 10px;border-radius:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.av{width:46px;height:46px;border-radius:16px;background:linear-gradient(150deg,var(--mar),var(--mar2));color:#fff;display:grid;place-items:center;font:800 1.2rem var(--t)}
.vacio{color:var(--suave);text-align:center}
.sec{font:800 .8rem var(--c);letter-spacing:.08em;text-transform:uppercase;color:var(--suave);margin:20px 4px 10px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -6px 24px #0e2a4720;padding:8px 8px calc(var(--sb) + 8px);z-index:5}
.nav button{flex:1;background:none;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;padding:6px}
.nav button.on{color:var(--mar)}.admin .nav button.on{color:var(--tinta)}
.fabwrap{position:fixed;bottom:calc(var(--sb) + 88px);left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:flex-end;padding:0 18px;pointer-events:none;z-index:6}
.fab{pointer-events:auto;width:60px;height:60px;border-radius:21px;background:var(--limon);color:var(--tinta);display:grid;place-items:center;box-shadow:0 10px 24px #0e2a4740}
#sheet{position:fixed;inset:0;background:#0e2a4788;display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
.sh{background:#fff;width:100%;max-width:480px;border-radius:30px 30px 0 0;padding:12px 20px calc(var(--sb) + 24px);max-height:90vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.grip{width:44px;height:5px;border-radius:9px;background:#D3DCE8;margin:0 auto 14px}
label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 5px}
input,select,textarea{width:100%;padding:13px 14px;border:2px solid transparent;border-radius:14px;background:var(--fondo)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--mar2);background:#fff}
.btn{width:100%;margin-top:18px;padding:15px;border-radius:16px;background:var(--mar);color:#fff;font-size:1rem}
.admin .btn{background:var(--tinta)}
.ck{display:flex;gap:10px;align-items:center;font-weight:600;margin:8px 0}.ck input{width:auto}
.msg{font-weight:700;margin:12px 0 0}.err{color:var(--error)}.ok{color:var(--mar)}
.auth{background:linear-gradient(160deg,var(--mar),var(--mar2) 62%,#7BE0C3)!important;display:flex;flex-direction:column}
.splash{flex:1;padding:calc(var(--sa) + 50px) 28px 30px;color:#fff}
.logo{width:72px;height:72px;border-radius:24px;background:var(--limon);color:var(--tinta);display:grid;place-items:center;margin-bottom:20px;box-shadow:0 12px 28px #0e2a4733}
.splash h1{font-size:3rem;font-weight:800}.splash p{margin:6px 0 0;font-size:1.1rem;opacity:.92}
.authcard{background:#fff;border-radius:32px 32px 0 0;padding:22px 22px calc(var(--sb) + 26px)}
.seg{display:flex;background:var(--fondo);border-radius:16px;padding:4px;margin-bottom:6px}
.seg button{flex:1;background:none;padding:10px;border-radius:12px;color:var(--suave)}.seg button.on{background:#fff;color:var(--tinta);box-shadow:0 2px 8px #0e2a4720}

.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#0B5566 0%,#0F8F8A 55%,#2FD0A6 100%);padding-bottom:66px}
.admin .hero{background:linear-gradient(145deg,#0A1F3C 0%,#1F4E86 60%,#4B86C9 100%)}
.hero::before{content:'';position:absolute;width:230px;height:230px;border-radius:50%;right:-64px;top:-56px;background:radial-gradient(circle at 30% 30%,#FFE493,#FFC83D 60%,#FFB300)}
.hero::after{content:'';position:absolute;width:170px;height:170px;border-radius:50%;left:-72px;bottom:-64px;background:#ffffff1f}
.hero>*{position:relative;z-index:1}
.ib{background:#0e2a4733;backdrop-filter:blur(8px)}
.sol{width:48px;height:48px;border-radius:17px;background:#ffffff2b;backdrop-filter:blur(8px);display:grid;place-items:center;margin-top:20px}
.hi{margin-top:12px}
.card{animation:in .5s cubic-bezier(.2,.8,.2,1) both;border:1px solid #fff;box-shadow:0 10px 30px #0e2a4716}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(n+5){animation-delay:.24s}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.fecha{background:linear-gradient(150deg,hsl(var(--k,200) 75% 36%),hsl(calc(var(--k,200) + 45) 80% 52%));box-shadow:0 6px 14px hsl(var(--k,200) 70% 40% / .35)}
.next{background:linear-gradient(135deg,#FFC83D,#FFE9A6 70%,#FFF3CC);box-shadow:0 14px 34px #ffc83d66}
.next .fecha{background:#fff;color:var(--tinta);box-shadow:0 6px 14px #0002}
.stats div{background:#ffffff26;backdrop-filter:blur(10px);border:1px solid #ffffff30}
.nav{left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(var(--sb) + 10px);border-radius:28px;padding:8px;box-shadow:0 14px 40px #0e2a4733}
.nav button{border-radius:20px;transition:background .2s}
.nav button.on{background:linear-gradient(135deg,#DDF5F0,#fff)}.admin .nav button.on{background:#E4ECF6}
.fab{background:linear-gradient(135deg,#FFC83D,#FF9F43)}
.btn{background:linear-gradient(135deg,var(--mar),var(--mar2));box-shadow:0 10px 22px #0f6e7c44}
.admin .btn{background:linear-gradient(135deg,#0E2A47,#2F6296);box-shadow:0 10px 22px #0e2a4744}
.auth{background:linear-gradient(160deg,#0B5566,#0F8F8A 55%,#2FD0A6)!important;position:relative;overflow:hidden}
.auth::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;right:-110px;top:-80px;background:radial-gradient(circle at 30% 30%,#FFE493,#FFC83D 65%,#FFB300)}
.auth::after{content:'';position:absolute;width:220px;height:220px;border-radius:50%;left:-90px;top:230px;background:#ffffff1c}
.splash,.authcard{position:relative;z-index:1}
.logo{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div><div id="sheet" onclick="if(event.target===this)cerrar()"></div>
<script>
// ===== CONFIGURA AQUÍ TU PROYECTO DE SUPABASE (Project Settings > API) =====
const SB_URL = 'https://TU-PROYECTO.supabase.co';
const SB_KEY = 'TU_CLAVE_ANON_PUBLICA';
// ==========================================================================
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saludo = () => { const h = new Date().getHours(); return h < 6 ? 'Buenas noches' : h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches'; };
const msg = (el, t, ok) => { el.className = 'msg ' + (ok ? 'ok' : 'err'); el.textContent = t; };
const salir = () => { tab = null; sb.auth.signOut(); };
const IC = {
 home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 4.5a3.5 3.5 0 0 1 0 7M19 15c2 .8 3 2.6 3 6"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/>',
 kid:'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3M9 9h.01M15 9h.01"/>',
 out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 clip:'<path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 8"/>',
 bell:'<path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 21h4"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
 moon:'<path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10z"/>',
 key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>'};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const hue = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const hola = n => { const h = new Date().getHours(); return `<div class="sol">${ic(h < 6 || h >= 21 ? 'moon' : 'sun', 26)}</div><div class="hi">${saludo()},<br>${esc(n)}</div>`; };
let tab = null, D = {}, recovery = /type=recovery/.test(location.hash);

/* ---------- Estructura de la app ---------- */
function shell(role, hero, body, tabs, fab) {
  app.className = role;
  app.innerHTML = `<div class="hero"><div class="top"><span>AMPA · Murcia</span><span style="display:flex;gap:8px"><button class="ib" aria-label="Cambiar contraseña" onclick="cambiarClave()">${ic('key', 20)}</button><button class="ib" aria-label="Salir" onclick="salir()">${ic('out', 20)}</button></span></div>${hero}</div>
  <div class="body">${body}</div>
  ${fab ? `<div class="fabwrap"><button class="fab" aria-label="Añadir" onclick="${fab}()">${ic('plus', 28)}</button></div>` : ''}
  <nav class="nav">${tabs.map(t => `<button class="${t.id === tab ? 'on' : ''}" onclick="tab='${t.id}';ruta2()">${ic(t.i)}${t.l}</button>`).join('')}</nav>`;
  window.scrollTo(0, 0);
}
function sheet(t, html) { const s = $('#sheet'); s.innerHTML = `<div class="sh"><div class="grip"></div><h2>${t}</h2>${html}</div>`; s.classList.add('on'); }
const cerrar = () => $('#sheet').classList.remove('on');
function form(fn) { $('#sheet form').onsubmit = async e => { e.preventDefault(); const b = e.submitter; if (b) b.disabled = true;
  const { error } = await fn(); if (error) { msg($('#m'), 'Error: ' + error.message); if (b) b.disabled = false; } else { cerrar(); ruta2(); } }; }
const fechaB = a => { const d = new Date(a.starts_at); return `<div class="fecha"><b>${d.getDate()}</b><span>${d.toLocaleString('es-ES', { month: 'short' })}</span></div>`; };
const hora = a => new Date(a.starts_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

/* ---------- Acceso ---------- */
function vistaAcceso(modo = 'entrar') {
  app.className = 'auth';
  app.innerHTML = `<div class="splash"><div class="logo">${ic('book', 36)}</div><h1>AMPA</h1><p>Región de Murcia · actividades de tu clase</p></div>
  <div class="authcard"><div class="seg"><button class="${modo === 'entrar' ? 'on' : ''}" onclick="vistaAcceso('entrar')">Entrar</button>
  <button class="${modo === 'alta' ? 'on' : ''}" onclick="vistaAcceso('alta')">Tengo un código</button></div>
  <form id="f">${modo === 'alta' ? '<label>Código del AMPA</label><input id="cod" required autocomplete="off" autocapitalize="characters" style="text-transform:uppercase">' : ''}
  <label>Correo electrónico</label><input id="em" type="email" required autocomplete="email">
  <label>Contraseña</label><input id="pw" type="password" minlength="6" required autocomplete="${modo === 'alta' ? 'new-password' : 'current-password'}">
  <button class="btn">${modo === 'alta' ? 'Crear mi cuenta' : 'Entrar'}</button><p id="m" class="msg"></p>
  ${modo === 'entrar' ? '<p style="text-align:center;margin:14px 0 0"><a href="#" onclick="recuperar();return false" style="color:var(--mar);font-weight:700">¿Has olvidado tu contraseña?</a></p>' : ''}</form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); const m = $('#m'), em = $('#em').value.trim(), pw = $('#pw').value;
    if (modo === 'entrar') { const { error } = await sb.auth.signInWithPassword({ email: em, password: pw }); if (error) msg(m, 'Correo o contraseña incorrectos.'); return; }
    const code = $('#cod').value.trim().toUpperCase();
    const { data: valido } = await sb.rpc('check_invitation', { p_code: code });
    if (!valido) return msg(m, 'Ese código no es válido o ya se ha usado.');
    const { data, error } = await sb.auth.signUp({ email: em, password: pw });
    if (error) return msg(m, 'No se pudo crear la cuenta: ' + error.message);
    localStorage.setItem('ampa_code', code);
    if (!data.session) msg(m, 'Revisa tu correo para confirmar la cuenta y después entra.', true);
  };
}

async function ruta(session) {
  if (!session) return vistaAcceso();
  let { data: perfil } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (!perfil) {
    const code = localStorage.getItem('ampa_code');
    if (code) { const { error } = await sb.rpc('claim_invitation', { p_code: code }); localStorage.removeItem('ampa_code');
      if (!error) ({ data: perfil } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle()); }
  }
  if (!perfil) return vistaSinCodigo();
  perfil.role === 'admin' ? vistaAdmin(perfil) : vistaFamilia(perfil);
}
async function ruta2() { const { data } = await sb.auth.getSession(); ruta(data.session); }

function vistaSinCodigo() {
  app.className = 'auth';
  app.innerHTML = `<div class="splash"><div class="logo">${ic('book', 36)}</div><h1>Casi listo</h1><p>Escribe el código que te dio el AMPA para vincular tu cuenta.</p></div>
  <div class="authcard"><form id="f"><label>Código del AMPA</label><input id="cod" required autocapitalize="characters" style="text-transform:uppercase">
  <button class="btn">Vincular</button><p id="m" class="msg"></p></form><button class="btn" style="background:var(--fondo);color:var(--tinta)" onclick="salir()">Salir</button></div>`;
  $('#f').onsubmit = async e => { e.preventDefault();
    const { error } = await sb.rpc('claim_invitation', { p_code: $('#cod').value });
    error ? msg($('#m'), 'Código no válido o ya usado.') : ruta2(); };
}

/* ---------- App de familias ---------- */
async function vistaFamilia(p) {
  if (!['inicio', 'hijos'].includes(tab)) tab = 'inicio';
  const [{ data: clases }, { data: acts }, { data: hijos }, { data: insc }, { data: files }] = await Promise.all([
    sb.from('classes').select('*').order('name'), sb.from('activities').select('*').order('starts_at'),
    sb.from('children').select('*').order('name'), sb.from('enrollments').select('activity_id,child_id'), sb.from('activity_files').select('*')]);
  D = { p, clases: clases || [] };
  const cl = Object.fromEntries(D.clases.map(c => [c.id, c])), ins = new Set((insc || []).map(i => i.activity_id + '|' + i.child_id));
  const ahora = Date.now(), prox = (acts || []).filter(a => new Date(a.starts_at) >= ahora), pas = (acts || []).filter(a => new Date(a.starts_at) < ahora).reverse();
  const card = (a, ab, cls) => {
    const hs = (hijos || []).filter(h => h.class_id === a.class_id), fs = (files || []).filter(f => f.activity_id === a.id);
    return `<div class="card act ${cls}" style="--k:${hue(a.class_id)}">${fechaB(a)}<div class="ai">${cls === 'next' ? '<div class="tag">Lo siguiente</div>' : ''}<h3>${esc(a.title)}</h3>
    <div class="meta">${hora(a)}${a.place ? ' · ' + esc(a.place) : ''} · ${esc(cl[a.class_id]?.name)}</div>
    ${a.description ? `<p style="margin:6px 0 0">${esc(a.description)}</p>` : ''}
    ${fs.length ? `<div class="btns">${fs.map(f => `<a class="pill" href="#" onclick="abrir('${esc(f.path)}');return false">${ic('clip', 15)}${esc(f.name)}</a>`).join('')}</div>` : ''}
    ${ab ? `<div class="btns">${hs.map(h => { const on = ins.has(a.id + '|' + h.id);
      return `<button class="pill ${on ? 'on' : ''}" onclick="inscribir('${a.id}','${h.id}',${on})">${on ? '✓ ' + esc(h.name) : 'Inscribir a ' + esc(h.name)}</button>`; }).join('') || '<span class="meta">Añade a tus hijos/as en la pestaña Hijos para inscribirlos.</span>'}</div>` : ''}
    </div></div>`; };
  const hero = `${hola(p.full_name)}<div>${D.clases.map(c => `<span class="chip">${esc(c.name)} · ${esc(c.course)}</span>`).join('')}</div>`;
  const body = tab === 'inicio'
    ? (prox.map((a, i) => card(a, true, i ? '' : 'next')).join('') || '<div class="card vacio">Todavía no hay actividades programadas para tu clase.</div>') + (pas.length ? `<div class="sec">Ya pasaron</div>${pas.map(a => card(a, false, 'old')).join('')}` : '')
    : (hijos || []).map(h => `<div class="card row"><div class="row" style="gap:12px"><div class="av">${esc(h.name[0]?.toUpperCase())}</div><div><b>${esc(h.name)}</b><div class="meta">${esc(cl[h.class_id]?.name)}</div></div></div>
      <button class="pill dan" aria-label="Quitar" onclick="borrar('children','id','${h.id}')">${ic('trash', 16)}</button></div>`).join('') || '<div class="card vacio">Pulsa + para añadir a tus hijos/as.</div>';
  shell('family', hero, body, [{ id: 'inicio', i: 'home', l: 'Inicio' }, { id: 'hijos', i: 'kid', l: 'Hijos' }], tab === 'hijos' ? 'addHijo' : '');
}
function addHijo() {
  sheet('Añadir hijo/a', `<form><label>Nombre</label><input id="hn" required><label>Clase</label>
  <select id="hc">${D.clases.map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.course)})</option>`).join('')}</select>
  <button class="btn">Guardar</button><p id="m" class="msg"></p></form>`);
  form(() => sb.from('children').insert({ parent_id: D.p.id, name: $('#hn').value.trim(), class_id: $('#hc').value }));
}

/* ---------- App de administración ---------- */
async function vistaAdmin(p) {
  if (!['familias', 'actividades', 'clases', 'equipo'].includes(tab)) tab = 'familias';
  const [{ data: clases }, { data: invs }, { data: acts }, { data: insc }, { data: files }, { data: perfs }] = await Promise.all([
    sb.from('classes').select('*').order('course', { ascending: false }).order('name'), sb.from('invitations').select('*').order('created_at', { ascending: false }),
    sb.from('activities').select('*').order('starts_at', { ascending: false }), sb.from('enrollments').select('activity_id, children(name)'), sb.from('activity_files').select('*'), sb.from('profiles').select('*').order('role').order('full_name')]);
  D = { clases: clases || [], perfs: perfs || [] };
  const cl = Object.fromEntries(D.clases.map(c => [c.id, c])), nom = c => c ? `${esc(c.name)} (${esc(c.course)})` : '—';
  const del = (t, c, v) => `<button class="pill dan" aria-label="Borrar" onclick="borrar('${t}','${c}','${v}')">${ic('trash', 16)}</button>`;
  let body = '';
  if (tab === 'familias') body = (invs || []).map(i => `<div class="card"><div class="row"><div><b>${esc(i.full_name)}</b><div class="meta">${i.class_ids.map(id => nom(cl[id])).join(', ')}</div></div>
    ${i.used_by ? '<span class="pill on">Registrado</span>' : del('invitations', 'code', esc(i.code))}</div>
    ${i.used_by ? '' : `<div class="btns"><span class="code" onclick="navigator.clipboard?.writeText('${esc(i.code)}');this.textContent='Copiado'">${esc(i.code)}</span>
    <a class="pill" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Hola ' + i.full_name + ', tu código para la app del AMPA es ' + i.code)}">Enviar por WhatsApp</a></div>`}</div>`).join('') || '<div class="card vacio">Pulsa + para añadir la primera familia.</div>';
  if (tab === 'actividades') body = (acts || []).map(a => { const fs = (files || []).filter(f => f.activity_id === a.id), is = (insc || []).filter(i => i.activity_id === a.id);
    return `<div class="card act" style="--k:${hue(a.class_id)}">${fechaB(a)}<div class="ai"><h3>${esc(a.title)}</h3><div class="meta">${hora(a)}${a.place ? ' · ' + esc(a.place) : ''} · ${nom(cl[a.class_id])}</div>
    <div class="meta">Inscritos (${is.length}): ${is.map(i => esc(i.children?.name)).join(', ') || '—'}</div>
    <div class="btns">${fs.map(f => `<a class="pill" href="#" onclick="abrir('${esc(f.path)}');return false">${ic('clip', 15)}${esc(f.name)}</a>`).join('')}
    <label class="pill" style="margin:0">${ic('plus', 15)}Adjuntar<input type="file" multiple hidden onchange="subirA('${a.id}',this.files)"></label>
    <button class="pill" onclick="avisar('${a.id}')">${ic('bell', 15)}Avisar</button>${del('activities', 'id', a.id)}</div></div></div>`; }).join('') || '<div class="card vacio">Pulsa + para publicar la primera actividad.</div>';
  if (tab === 'clases') body = D.clases.map(c => `<div class="card row"><div><b>${esc(c.name)}</b><div class="meta">Curso ${esc(c.course)}</div></div>${del('classes', 'id', c.id)}</div>`).join('') || '<div class="card vacio">Pulsa + para crear la primera clase.</div>';
  if (tab === 'equipo') body = (perfs || []).map((x, i) => `<div class="card row"><div class="row" style="gap:12px"><div class="av">${esc(x.full_name[0]?.toUpperCase())}</div>
    <div><b>${esc(x.full_name)}</b><div class="meta">${esc(x.email || 'sin correo guardado')}</div></div></div>
    <div class="btns" style="margin:0;flex-wrap:nowrap"><button class="pill" aria-label="Contraseña" onclick="claveUsuario(${i})">${ic('key', 15)}</button><button class="pill ${x.role === 'admin' ? 'on' : ''}" onclick="setAdmin(${i},${x.role !== 'admin'})">${x.role === 'admin' ? '✓ Admin' : 'Hacer admin'}</button></div></div>`).join('') || '<div class="card vacio">Aún no hay usuarios.</div>';
  const hero = `${hola(p.full_name)}<div class="stats"><div><b>${(invs || []).length}</b>familias</div><div><b>${(acts || []).length}</b>actividades</div><div><b>${D.clases.length}</b>clases</div></div>`;
  shell('admin', hero, body, [{ id: 'familias', i: 'users', l: 'Familias' }, { id: 'actividades', i: 'cal', l: 'Actividades' }, { id: 'clases', i: 'book', l: 'Clases' }, { id: 'equipo', i: 'shield', l: 'Equipo' }], { familias: 'addFam', actividades: 'addAct', clases: 'addClase', equipo: 'addAdmin' }[tab]);
}
function addFam() {
  sheet('Añadir familia', `<form><label>Nombre del padre/madre</label><input id="fn" required><label>Clase(s) de sus hijos/as</label>
  ${D.clases.map(c => `<label class="ck"><input type="checkbox" value="${c.id}">${esc(c.name)} (${esc(c.course)})</label>`).join('') || '<p class="meta">Crea primero una clase.</p>'}
  <button class="btn">Generar código</button><p id="m" class="msg"></p></form>`);
  form(() => { const ids = [...document.querySelectorAll('#sheet input:checked')].map(x => x.value);
    if (!ids.length) return { error: { message: 'Elige al menos una clase.' } };
    const a = new Uint8Array(8); crypto.getRandomValues(a);
    const code = [...a].map(b => 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[b % 31]).join('');
    return sb.from('invitations').insert({ code, full_name: $('#fn').value.trim(), class_ids: ids }); });
}
function addClase() {
  sheet('Nueva clase', `<form><label>Nombre</label><input id="cn" placeholder="3º A Primaria" required><label>Curso</label><input id="cc" placeholder="2026-2027" required>
  <button class="btn">Crear clase</button><p id="m" class="msg"></p></form>`);
  form(() => sb.from('classes').insert({ name: $('#cn').value.trim(), course: $('#cc').value.trim() }));
}
function addAct() {
  sheet('Nueva actividad', `<form><label>Clase</label><select id="ac" required>${D.clases.map(c => `<option value="${c.id}">${esc(c.name)} (${esc(c.course)})</option>`).join('')}</select>
  <label>Título</label><input id="at" required><label>Fecha y hora</label><input id="af" type="datetime-local" required><label>Lugar</label><input id="al">
  <label>Descripción</label><textarea id="ad" rows="3"></textarea><label>Adjuntos (PDF, imágenes)</label><input id="aa" type="file" multiple accept=".pdf,image/*">
  <label class="ck"><input id="an" type="checkbox">Avisar por correo a las familias de la clase</label>
  <button class="btn">Publicar</button><p id="m" class="msg"></p></form>`);
  form(async () => {
    const { data, error } = await sb.from('activities').insert({ class_id: $('#ac').value, title: $('#at').value.trim(), place: $('#al').value.trim() || null,
      description: $('#ad').value.trim() || null, starts_at: new Date($('#af').value).toISOString() }).select('id').single();
    if (error) return { error };
    const r = await subir(data.id, $('#aa').files); if (r.error) return r;
    if ($('#an').checked) { const { error: e2 } = await sb.functions.invoke('notify-activity', { body: { activity_id: data.id } });
      if (e2) return { error: { message: 'Se creó, pero no se pudo enviar el correo.' } }; }
    return {};
  });
}

function addAdmin() {
  sheet('Nuevo administrador', `<form><p class="meta">La persona debe estar ya registrada en la app.</p><label>Correo</label><input id="ae" type="email" required>
  <button class="btn">Dar permisos</button><p id="m" class="msg"></p></form>`);
  form(() => sb.rpc('set_admin', { p_email: $('#ae').value.trim(), p_admin: true }));
}
async function setAdmin(i, on) {
  const email = D.perfs[i]?.email;
  if (!email || !confirm((on ? 'Dar' : 'Quitar') + ' permisos de administrador a ' + email + '?')) return;
  const { error } = await sb.rpc('set_admin', { p_email: email, p_admin: on });
  error ? alert(error.message) : ruta2();
}

/* ---------- Contraseñas ---------- */
function cambiarClave() {
  sheet('Cambiar contraseña', `<form><label>Nueva contraseña</label><input id="np" type="password" minlength="6" required autocomplete="new-password">
  <button class="btn">Guardar</button><p id="m" class="msg"></p></form>`);
  form(() => sb.auth.updateUser({ password: $('#np').value }));
}
async function recuperar() {
  const em = prompt('Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva:');
  if (!em) return;
  const { error } = await sb.auth.resetPasswordForEmail(em.trim(), { redirectTo: location.origin + location.pathname });
  alert(error ? 'No se pudo enviar el correo.' : 'Si el correo existe, te hemos enviado un enlace.');
}
function vistaNuevaClave() {
  app.className = 'auth';
  app.innerHTML = `<div class="splash"><div class="logo">${ic('key', 36)}</div><h1>Nueva contraseña</h1><p>Elige una contraseña nueva para tu cuenta.</p></div>
  <div class="authcard"><form id="f"><label>Nueva contraseña</label><input id="np" type="password" minlength="6" required autocomplete="new-password">
  <button class="btn">Guardar y entrar</button><p id="m" class="msg"></p></form></div>`;
  $('#f').onsubmit = async e => { e.preventDefault(); const { error } = await sb.auth.updateUser({ password: $('#np').value });
    if (error) return msg($('#m'), 'No se pudo cambiar: ' + error.message);
    recovery = false; history.replaceState(null, '', location.pathname); ruta2(); };
}
function claveUsuario(i) {
  const x = D.perfs[i];
  sheet('Contraseña de ' + esc(x.full_name), `<form><p class="meta">Las contraseñas no se pueden leer: se guardan cifradas. Aquí puedes fijar una nueva o enviar un enlace por correo.</p>
  <label>Nueva contraseña temporal (mín. 8)</label><input id="np" type="text" minlength="8" required autocomplete="off">
  <button class="btn">Establecer contraseña</button><p id="m" class="msg"></p></form>
  <button class="btn" style="background:var(--fondo);color:var(--tinta);box-shadow:none" onclick="enlaceClave(${i})">Enviar enlace por correo</button>`);
  form(async () => { const { data, error } = await sb.functions.invoke('admin-password', { body: { user_id: x.id, password: $('#np').value } });
    return { error: error || (data?.error ? { message: data.error } : null) }; });
}
async function enlaceClave(i) {
  const em = D.perfs[i].email;
  const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
  alert(error ? 'No se pudo enviar el correo.' : 'Enlace enviado a ' + em); cerrar();
}

/* ---------- Acciones ---------- */
async function borrar(tabla, col, val) {
  if (!confirm('¿Seguro que quieres borrarlo?')) return;
  const { error } = await sb.from(tabla).delete().eq(col, val); error ? alert('No se pudo borrar: ' + error.message) : ruta2();
}
async function abrir(path) {
  const { data, error } = await sb.storage.from('adjuntos').createSignedUrl(path, 300);
  error ? alert('No se pudo abrir el archivo.') : window.open(data.signedUrl, '_blank');
}
async function inscribir(a, c, on) {
  const q = on ? sb.from('enrollments').delete().eq('activity_id', a).eq('child_id', c) : sb.from('enrollments').insert({ activity_id: a, child_id: c });
  const { error } = await q; error ? alert('No se pudo guardar: ' + error.message) : ruta2();
}
async function subir(actId, files) {
  for (const f of files) {
    const path = actId + '/' + Date.now() + '-' + f.name.replace(/[^A-Za-z0-9._-]/g, '_');
    let { error } = await sb.storage.from('adjuntos').upload(path, f); if (error) return { error };
    ({ error } = await sb.from('activity_files').insert({ activity_id: actId, name: f.name, path })); if (error) return { error };
  }
  return {};
}
async function subirA(id, files) { const r = await subir(id, files); r.error ? alert('No se pudo subir: ' + r.error.message) : ruta2(); }
async function avisar(id) {
  if (!confirm('¿Enviar un correo a las familias de esta clase?')) return;
  const { data, error } = await sb.functions.invoke('notify-activity', { body: { activity_id: id } });
  alert(error ? 'No se pudo enviar el correo.' : 'Correo enviado a ' + data.sent + ' familia(s).');
}

sb.auth.onAuthStateChange((ev, s) => {
  if (ev === 'PASSWORD_RECOVERY') recovery = true;
  if (recovery && s) return void setTimeout(vistaNuevaClave, 0);
  if (['SIGNED_IN', 'SIGNED_OUT', 'INITIAL_SESSION'].includes(ev)) setTimeout(() => ruta(s), 0);
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
